# =============================================================================
# Payment Boundary Guard — Model A (ADR-0005, jol-m-infrastructure)
# =============================================================================
# E1 + E2 enforcement: jol-hub must NEVER reach Stripe directly. The
# marketplace payments_app is the sole Stripe integrator; hub consumes the
# internal payment API only (docs/payment-api-contract.md).
#
# Jobs below are REQUIRED status checks on main (armed STEP 19; see
# jol-m-infrastructure/docs/payment-boundary-enforcement.md). No path
# filter on purpose: residue can land anywhere in the tree.
#
# The vendored scripts/check-payment-boundary.sh is pinned by sha256 to
# the record copy in jol-m-infrastructure. Updating the guard requires
# landing the change in BOTH repos and bumping the pin in the same
# change window (record-copy contract; exceptions need an ADR).
# =============================================================================

name: Payment Boundary Guard

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_call:
    inputs:
      repo-layout:
        description: 'Repo layout: monorepo or flat'
        required: false
        type: string
        default: 'monorepo'
    secrets: {}

permissions:
  contents: read

jobs:
  payment-boundary-guard:
    name: Payment Boundary Guard (E1, ADR-0005)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Guard integrity — vendored copy matches pinned record hash
        if: hashFiles('scripts/check-payment-boundary.sh') != ''
        run: |
          # Accept both monorepo (jol-hub) and flat (site-*) guard variants
          ACTUAL=$(sha256sum scripts/check-payment-boundary.sh | cut -d" " -f1)
          MONOREPO_HASH="4e23704faa9824e9f4c8a4f673646b96127a38b967349c3515ccccf7d419e6f1"
          FLAT_HASH="583b0bc907f5e52d84b88d0246e403a4dc41d15182b8f26cff3293e0bbfb3b31"
          if [ "$ACTUAL" != "$MONOREPO_HASH" ] && [ "$ACTUAL" != "$FLAT_HASH" ]; then
            echo "::error::check-payment-boundary.sh hash mismatch"
            echo "  Actual:    $ACTUAL"
            echo "  Expected:  $MONOREPO_HASH (monorepo) or $FLAT_HASH (flat)"
            exit 1
          fi
          echo "Guard script hash verified ($ACTUAL)"

      - name: Run E1 payment-boundary guard
        if: hashFiles('scripts/check-payment-boundary.sh') != ''
        run: bash scripts/check-payment-boundary.sh "$GITHUB_WORKSPACE"

  dependency-guard:
    name: Dependency Guard (E2, ADR-0005)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: pip install pytest

      - name: Run E2 dependency guard
        if: hashFiles('data/tests/test_dependency_guard.py') != ''
        run: python -m pytest data/tests/test_dependency_guard.py -v