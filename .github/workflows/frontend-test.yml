# =============================================================================
# Frontend Testing Pipeline — STEP 15
# =============================================================================
# Supports two repo layouts via workflow_call input:
#   monorepo  — jol-hub style (frontend/ subdirectory, pnpm workspace)
#   flat      — site-* style (Next.js app at repo root)
# =============================================================================

name: Frontend Testing

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'app/**'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'app/**'
      - '.github/workflows/frontend-test.yml'
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      pnpm-version:
        description: 'pnpm version'
        required: false
        type: string
        default: '10.30.3'
      repo-layout:
        description: 'Repo layout: monorepo (frontend/ subdir) or flat (root)'
        required: false
        type: string
        default: 'monorepo'
    secrets:
      NPM_TOKEN:
        required: false

env:
  NODE_VERSION: ${{ inputs.node-version || '20' }}
  PNPM_VERSION: ${{ inputs.pnpm-version || '10.30.3' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit + Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ (inputs.repo-layout || 'monorepo') == 'monorepo' && 'frontend' || '.' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ (inputs.repo-layout || 'monorepo') == 'monorepo' && 'frontend/pnpm-lock.yaml' || 'pnpm-lock.yaml' }}
      - name: Configure npm registry
        run: |
          echo "@journeyoflife-org:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-report
          path: ${{ (inputs.repo-layout || 'monorepo') == 'monorepo' && 'frontend/apps/template-renderer/coverage' || 'coverage' }}
          retention-days: 14

  build-gate:
    name: Build + budget gate + secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ (inputs.repo-layout || 'monorepo') == 'monorepo' && 'frontend' || '.' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ (inputs.repo-layout || 'monorepo') == 'monorepo' && 'frontend/pnpm-lock.yaml' || 'pnpm-lock.yaml' }}
      - name: Configure npm registry
        run: |
          echo "@journeyoflife-org:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Secret-leakage scan
        run: pnpm check-secrets || true

  a11y:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ (inputs.repo-layout || 'monorepo') == 'monorepo' && 'frontend' || '.' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ (inputs.repo-layout || 'monorepo') == 'monorepo' && 'frontend/pnpm-lock.yaml' || 'pnpm-lock.yaml' }}
      - name: Configure npm registry
        run: |
          echo "@journeyoflife-org:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: axe-core page scans
        run: pnpm check-a11y || true
        env:
          A11Y_BASEURL: http://localhost:3000

  security:
    name: Security (audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ (inputs.repo-layout || 'monorepo') == 'monorepo' && 'frontend' || '.' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ (inputs.repo-layout || 'monorepo') == 'monorepo' && 'frontend/pnpm-lock.yaml' || 'pnpm-lock.yaml' }}
      - name: Configure npm registry
        run: |
          echo "@journeyoflife-org:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

  test-summary:
    name: Frontend testing summary
    runs-on: ubuntu-latest
    if: always()
    needs: [unit, build-gate, a11y, security]
    steps:
      - name: Fail if any tier failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more test tiers failed — see artifacts."
          exit 1
